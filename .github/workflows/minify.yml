name: Minify and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  minify-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Minification Tools
        run: |
          npm install -g html-minifier-terser clean-css-cli terser

      - name: Safely Minify Files In-Place
        run: |
          find . -name "*.html" ! -path "./.git/*" -exec html-minifier-terser --collapse-whitespace --conservative-collapse --remove-comments --minify-css true --minify-js true -o {} {} \;
          find . -name "*.css" ! -path "./.git/*" -exec cleancss -O1 -o {} {} \;
          find . -name "*.js" ! -path "./.git/*" -exec terser {} --compress -o {} \;

      - name: Commit and Push to 'min' Branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: min
          create_branch: true
          commit_message: "refactor(): safely auto-minified assets for deployment"
          file_pattern: "*.html *.css *.js **/*.html **/*.css **/*.js"
          push_options: '--force'
