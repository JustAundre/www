name: sync-docs
permissions:
  contents: write
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: |
          git config user.name 'sync-bot'
          git config user.email 'sync-bot@users.noreply.github.com'

          git submodule update --remote --recursive
          git add docs
          git diff --cached --quiet || git commit -m 'update(): bump wiki submodules.'

          ./.github/workflows/mktoc.sh
          git add docs
          git diff --cached --quiet || git commit -m 'update(): regenerate table of contents.'
          git push
